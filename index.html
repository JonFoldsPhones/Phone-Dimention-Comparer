        name: 'Nintendo Switch', brand: 'Nintendo', category: 'Handhelds', hasFold: false,
        variants: { normal: { bw: 239.0, bh: 102.0, sw: 137.3, sh: 77.2, thickness: 13.9, maxThickness: 28.4, thicknessNote: '13.9 mm tablet body • 28.4 mm w/ sticks & ZL/ZR triggers', br: 20, sr: 2, defaultPortrait: false } }
      },
      steam_deck_oled: {
        name: 'Steam Deck OLED', brand: 'Valve', category: 'Handhelds', hasFold: false,
        variants: { normal: { bw: 298.0, bh: 117.0, sw: 159.4, sh: 99.6, thickness: 20.3, maxThickness: 49.0, thicknessNote: '20.3 mm center screen chassis • 49.0 mm w/ grips & sticks', br: 24, sr: 2, defaultPortrait: false } }
      },
      rabbit_r1: {
        name: 'Rabbit R1', brand: 'Rabbit', category: 'Retro and Misc', hasFold: false,
        variants: { normal: { bw: 78.0, bh: 78.0, sw: 43.9, sh: 58.5, thickness: 13.0, br: 10, sr: 4, defaultPortrait: true } }
      },
      credit_card: {
        name: 'Standard Credit Card', brand: 'Reference', category: 'Reference', hasFold: false,
        variants: { normal: { bw: 85.6, bh: 54.0, sw: 85.6, sh: 54.0, thickness: 0.76, br: 3.2, sr: 3.2, defaultPortrait: false } }
      }
    };

    const formatThick = (val) => {
      if (val === undefined || val === null) return '';
      return Math.round(val * 100) % 10 !== 0 ? val.toFixed(2) : val.toFixed(1);
    };

    const CATEGORIES = ['All', 'Foldables', 'Phones', 'Tablets', 'Handhelds', 'Retro and Misc', 'Reference'];

    const SLOT_THEMES = {
      1: { color: "border-blue-500", sbg: "bg-blue-100", overlayColor: "rgba(59, 130, 246, 0.2)", overlayScreenColor: "rgba(59, 130, 246, 0.5)", legendColor: "bg-blue-500/60 ring-blue-500/30", mediaBg: "bg-slate-800", mediaBgOverlay: "bg-blue-700/70 border border-blue-400/50" },
      2: { color: "border-orange-500", sbg: "bg-orange-100", overlayColor: "rgba(249, 115, 22, 0.2)", overlayScreenColor: "rgba(249, 115, 22, 0.5)", legendColor: "bg-orange-500/60 ring-orange-500/30", mediaBg: "bg-slate-800", mediaBgOverlay: "bg-orange-700/70 border border-orange-400/50" }
    };

    const RATIOS = {
      'none': { label: 'None (Full Screen)', value: null },
      '16:9': { label: '16:9 (Standard Video)', value: 16 / 9 },
      '9:16': { label: '9:16 (Vertical Video)', value: 9 / 16 },
      '21:9': { label: '21:9 (Cinematic)', value: 21 / 9 },
      '4:3': { label: '4:3 (Classic TV)', value: 4 / 3 },
      '1:1': { label: '1:1 (Square)', value: 1 / 1 },
    };

    const App = () => {
      const [slot1, setSlot1] = useState({ id: 'iphone_duo', formFactor: 'folded', portrait: true });
      const [slot2, setSlot2] = useState({ id: 'z_fold_8_ultra', formFactor: 'folded', portrait: true });
      const [showBezel, setShowBezel] = useState(true);
      const [viewMode, setViewMode] = useState('side-by-side');
      const [perspective, setPerspective] = useState('front-and-side');
      const [alignment, setAlignment] = useState('center');
      const [mediaRatio, setMediaRatio] = useState('16:9');
      const [scale, setScale] = useState(2.2);

      const handleDeviceChange = (slot, newId) => {
        const device = DEVICES[newId];
        const formFactor = device.hasFold ? 'folded' : 'normal';
        const portrait = device.variants[formFactor].defaultPortrait;
        if (slot === 1) setSlot1({ id: newId, formFactor, portrait });
        else setSlot2({ id: newId, formFactor, portrait });
      };

      const updateSlot = (slotNum, updates) => {
        if (slotNum === 1) setSlot1({ ...slot1, ...updates });
        else setSlot2({ ...slot2, ...updates });
      };

      const getComputedDims = (config, slotNum, currentRatio) => {
        const device = DEVICES[config.id];
        const variant = device.variants[config.formFactor];
        const theme = SLOT_THEMES[slotNum];
        const isDefaultPortrait = variant.defaultPortrait;
        const shouldSwap = config.portrait !== isDefaultPortrait;

        let curBw = variant.bw, curBh = variant.bh, curSw = variant.sw, curSh = variant.sh;
        let curSecondScreen = variant.secondScreen ? { ...variant.secondScreen } : null;
        if (shouldSwap) {
          [curBw, curBh] = [curBh, curBw];
          [curSw, curSh] = [curSh, curSw];
          if (curSecondScreen) {
            [curSecondScreen.sw, curSecondScreen.sh] = [curSecondScreen.sh, curSecondScreen.sw];
          }
        }

        const foldLabels = device.foldLabels || ['Folded', 'Unfolded'];
        const formName = device.hasFold ? ` (${config.formFactor === 'folded' ? foldLabels[0] : foldLabels[1]})` : '';
        const screenArea = curSw * curSh;
        const ratioVal = RATIOS[currentRatio].value;
        let mediaW = 0, mediaH = 0, mediaArea = 0;
        
        if (ratioVal) {
          mediaW = Math.min(curSw, curSh * ratioVal);
          mediaH = Math.min(curSh, curSw / ratioVal);
          mediaArea = mediaW * mediaH;
        }

        let finalDims = {
          name: `${device.name}${formName}`,
          color: theme.color, bg: "bg-white", sbg: theme.sbg,
          overlayColor: theme.overlayColor, overlayScreenColor: theme.overlayScreenColor,
          mediaBg: theme.mediaBg, mediaBgOverlay: theme.mediaBgOverlay,
          br: variant.br, sr: variant.sr, rawBw: curBw, rawBh: curBh, rawSw: curSw, rawSh: curSh,
          thickness: variant.thickness,
          maxThickness: variant.maxThickness || null,
          thicknessNote: variant.thicknessNote || null,
          isFoldedState: device.hasFold && config.formFactor === 'folded',
          profileType: variant.profileType || (device.hasFold && config.formFactor === 'folded' ? 'book-folded' : 'slab'),
          screenHiddenWhenClosed: !!variant.screenHiddenWhenClosed,
          secondScreen: curSecondScreen,
          shouldSwap,
          screenArea, mediaW, mediaH, mediaArea
        };

        if (!showBezel) return { ...finalDims, bw: curSw, bh: curSh, sw: curSw, sh: curSh, br: variant.sr, secondScreen: null };
        return { ...finalDims, bw: curBw, bh: curBh, sw: curSw, sh: curSh };
      };

      const dims1 = getComputedDims(slot1, 1, mediaRatio);
      const dims2 = getComputedDims(slot2, 2, mediaRatio);

      const getThicknessComparisonText = (d1, d2) => {
        if (!d1?.thickness || !d2?.thickness) return null;
        const t1 = d1.thickness;
        const t2 = d2.thickness;

        if (Math.abs(t1 - t2) < 0.01) {
          return (
            <div className="flex flex-col gap-0.5">
              <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Chassis Thickness</span>
              <div className="text-sm font-bold text-gray-800">Identical Thickness ({formatThick(t1)} mm)</div>
            </div>
          );
        }

        const is1Thicker = t1 > t2;
        const thickerDims = is1Thicker ? d1 : d2;
        const thinnerDims = is1Thicker ? d2 : d1;
        const diffMm = Math.abs(t1 - t2);
        const percentThicker = (((thickerDims.thickness / thinnerDims.thickness) - 1) * 100).toFixed(1);
        const highlightColor = is1Thicker ? 'text-blue-600' : 'text-orange-600';

        return (
          <div className="flex flex-col gap-0.5">
            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">
              Chassis Thickness ({formatThick(t1)} mm vs {formatThick(t2)} mm)
            </span>
            <div className="text-sm text-gray-700 leading-tight">
              <span className="font-bold text-gray-900">{thickerDims.name}</span> is <span className={`font-black ${highlightColor}`}>+{formatThick(diffMm)} mm (+{percentThicker}%)</span> thicker than {thinnerDims.name}
            </div>
          </div>
        );
      };

      const getComparisonText = (val1, val2, name1, name2, label) => {
        if (!val1 || !val2) return null;
        if (Math.abs(val1 - val2) < 0.1) {
          return (
            <div className="flex flex-col gap-0.5">
              <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">{label}</span>
              <div className="text-sm font-bold text-gray-800">Identical Size (0% difference)</div>
            </div>
          );
        }

        const is1Bigger = val1 > val2;
        const biggerName = is1Bigger ? name1 : name2;
        const smallerName = is1Bigger ? name2 : name1;
        const percentBigger = (((Math.max(val1, val2) / Math.min(val1, val2)) - 1) * 100).toFixed(1);
        const highlightColor = is1Bigger ? 'text-blue-600' : 'text-orange-600';

        return (
          <div className="flex flex-col gap-0.5">
            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">{label}</span>
            <div className="text-sm text-gray-700 leading-tight">
              <span className="font-bold text-gray-900">{biggerName}</span> is <span className={`font-black ${highlightColor}`}>+{percentBigger}%</span> larger than {smallerName}
            </div>
          </div>
        );
      };

      const SideProfileBar = ({ dims, isOverlay, slotNum, vertical = true }) => {
        const pBh = dims.bh * scale;
        const pBw = dims.bw * scale;
        const pThick = Math.max(1.5, dims.thickness * scale);
        const pMaxThick = dims.maxThickness ? dims.maxThickness * scale : null;
        const edgeRadius = Math.min(pThick / 2, 4 * scale);

        if (vertical) {
          return (
            <div className="flex flex-col items-center justify-end">
              <div className="relative flex items-center justify-center" style={{ height: `${pBh}px`, width: `${pMaxThick || pThick}px` }}>
                {pMaxThick && dims.profileType !== 'wedge' && (
                  <div
                    title={dims.thicknessNote || `Max protrusion: ${formatThick(dims.maxThickness)} mm`}
                    className={`absolute inset-y-0 left-0 border border-dashed ${dims.color} opacity-55 rounded-sm`}
                    style={{
                      width: `${pMaxThick}px`,
                      height: `${pBh}px`,
                      backgroundColor: isOverlay ? dims.overlayColor : 'rgba(148, 163, 184, 0.15)'
                    }}
                  />
                )}
                {dims.profileType === 'wedge' && pMaxThick ? (
                  <div
                    title={dims.thicknessNote}
                    className={`relative border-2 ${dims.color} shadow-md transition-all duration-500 overflow-hidden`}
                    style={{
                      width: `${pMaxThick}px`,
                      height: `${pBh}px`,
                      backgroundColor: isOverlay ? dims.overlayScreenColor : dims.sbg,
                      clipPath: `polygon(0 0, 100% 0, ${(pThick / pMaxThick) * 100}% 100%, 0 100%)`
                    }}
                  />
                ) : (
                  <div
                    className={`relative border-2 ${dims.color} shadow-md transition-all duration-500 overflow-hidden flex flex-col justify-between`}
                    style={{
                      width: `${pThick}px`,
                      height: `${pBh}px`,
                      borderRadius: `${edgeRadius}px`,
                      backgroundColor: isOverlay ? dims.overlayScreenColor : dims.sbg,
                      marginLeft: pMaxThick ? 0 : 'auto',
                      marginRight: 'auto'
                    }}
                  >
                    {dims.profileType === 'trifold-folded' ? (
                      <>
                        <div className="absolute inset-y-0 left-1/3 -translate-x-1/2 w-px bg-gray-700/45" />
                        <div className="absolute inset-y-0 left-2/3 -translate-x-1/2 w-px bg-gray-700/45" />
                      </>
                    ) : (dims.profileType === 'book-folded' || dims.profileType === 'clamshell-folded' || dims.profileType === 'slider-closed') ? (
                      <div className="absolute inset-y-0 left-1/2 -translate-x-1/2 w-px bg-gray-600/45" />
                    ) : null}
                  </div>
                )}
              </div>
              {!isOverlay && (
                <div className="mt-2 flex flex-col items-center">
                  <span className={`text-[10px] font-black px-1.5 py-0.5 rounded shadow-sm border ${slotNum === 1 ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-orange-50 text-orange-700 border-orange-200'}`}>
                    {dims.profileType === 'wedge' && dims.maxThickness
                      ? `${formatThick(dims.thickness)}–${formatThick(dims.maxThickness)} mm`
                      : `${formatThick(dims.thickness)} mm`}
                  </span>
                  {dims.maxThickness && dims.profileType !== 'wedge' && (
                    <span className="text-[9px] text-gray-500 font-semibold mt-0.5">
                      max {formatThick(dims.maxThickness)} mm
                    </span>
                  )}
                </div>
              )}
            </div>
          );
        }

        const tableScale = Math.max(scale, 3.2);
        const hWidth = dims.bw * tableScale;
        const hThick = Math.max(2, dims.thickness * tableScale);
        const hMaxThick = dims.maxThickness ? dims.maxThickness * tableScale : null;
        const hRadius = Math.min(hThick / 2, 4 * tableScale);
        const cardsCount = (dims.thickness / 0.76).toFixed(1);

        return (
          <div className="flex flex-col items-center">
            <div className="relative flex flex-col items-center justify-end" style={{ width: `${hWidth}px`, height: `${hMaxThick || hThick}px` }}>
              {hMaxThick && dims.profileType !== 'trifold-unfolded' && dims.profileType !== 'wedge' && (
                <div
                  className={`absolute inset-x-0 bottom-0 border border-dashed ${dims.color} rounded-t-md flex items-start justify-center pt-1`}
                  style={{
                    width: `${hWidth}px`,
                    height: `${hMaxThick}px`,
                    backgroundColor: 'rgba(148, 163, 184, 0.14)'
                  }}
                >
                  <span className="text-[10px] font-bold text-gray-600 bg-white/80 px-1.5 rounded">
                    Max: {formatThick(dims.maxThickness)} mm
                  </span>
                </div>
              )}
              {dims.profileType === 'trifold-unfolded' && hMaxThick ? (
                <div className="w-full flex items-end">
                  <div className={`border-2 border-r ${dims.color} shadow-lg`} style={{ width: '33.33%', height: `${hThick}px`, backgroundColor: dims.sbg, borderTopLeftRadius: `${hRadius}px`, borderBottomLeftRadius: `${hRadius}px` }} />
                  <div className={`border-y-2 border-r ${dims.color} shadow-lg`} style={{ width: '33.33%', height: `${hThick}px`, backgroundColor: dims.sbg }} />
                  <div className={`border-2 ${dims.color} shadow-lg flex items-center justify-center`} style={{ width: '33.34%', height: `${hMaxThick}px`, backgroundColor: dims.sbg, borderTopRightRadius: `${hRadius}px`, borderBottomRightRadius: `${hRadius}px` }}>
                    <span className="text-[9px] font-bold text-gray-700">{formatThick(dims.maxThickness)} mm</span>
                  </div>
                </div>
              ) : dims.profileType === 'wedge' && hMaxThick ? (
                <div
                  className={`relative border-2 ${dims.color} shadow-lg transition-all duration-500 overflow-hidden`}
                  style={{
                    width: `${hWidth}px`,
                    height: `${hMaxThick}px`,
                    backgroundColor: dims.sbg,
                    clipPath: `polygon(0 ${(1 - hThick / hMaxThick) * 100}%, 100% 0, 100% 100%, 0 100%)`
                  }}
                />
              ) : (
                <div
                  className={`relative border-2 ${dims.color} shadow-lg transition-all duration-500 overflow-hidden`}
                  style={{
                    width: `${hWidth}px`,
                    height: `${hThick}px`,
                    borderRadius: `${hRadius}px`,
                    backgroundColor: dims.sbg
                  }}
                >
                  {dims.profileType === 'trifold-folded' ? (
                    <>
                      <div className="absolute inset-x-0 top-1/3 -translate-y-1/2 h-px bg-gray-700/45" />
                      <div className="absolute inset-x-0 top-2/3 -translate-y-1/2 h-px bg-gray-700/45" />
                    </>
                  ) : (dims.profileType === 'book-folded' || dims.profileType === 'clamshell-folded' || dims.profileType === 'slider-closed') ? (
                    <div className="absolute inset-x-0 top-1/2 -translate-y-1/2 h-px bg-gray-600/45" />
                  ) : null}
                </div>
              )}
            </div>
            <div className="w-full h-1 bg-gradient-to-r from-transparent via-gray-400 to-transparent rounded-full mt-0.5 opacity-60" />

            <div className="mt-3 text-center bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-xl shadow-sm border border-gray-200/80">
              <div className="font-bold text-gray-800 text-sm">{dims.name}</div>
              <div className="flex items-center justify-center gap-2 mt-1">
                <span className={`text-xs font-black px-2 py-0.5 rounded ${slotNum === 1 ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800'}`}>
                  {dims.profileType === 'wedge' && dims.maxThickness
                    ? `${formatThick(dims.thickness)}–${formatThick(dims.maxThickness)} mm wedge`
                    : `${formatThick(dims.thickness)} mm thick`}
                </span>
                <span className="text-xs text-gray-500 font-medium">
                  (≈ {cardsCount} credit cards)
                </span>
              </div>
              {dims.thicknessNote && (
                <div className="text-[11px] text-gray-500 font-medium mt-1">
                  {dims.thicknessNote}
                </div>
              )}
            </div>
          </div>
        );
      };

      const DevicePreview = ({ dims, isOverlay, slotNum }) => {
        const pBw = dims.bw * scale, pBh = dims.bh * scale, pSw = dims.sw * scale, pSh = dims.sh * scale;
        const pBr = dims.br * scale, pSr = dims.sr * scale;
        const ratioVal = RATIOS[mediaRatio].value;
        const mediaDiagonal = ratioVal ? (Math.sqrt(dims.mediaW**2 + dims.mediaH**2) / 25.4).toFixed(2) : 0;
        const previewAlignClass = !isOverlay && (alignment === 'left' || alignment === 'bottom-left') ? 'items-start md:items-center' : 'items-center';
        const hideClosedClamshellScreen = dims.screenHiddenWhenClosed && showBezel;

        return (
          <div className={`relative flex flex-col ${previewAlignClass} justify-center transition-all duration-500 ease-[cubic-bezier(0.23,1,0.32,1)]`} style={{ zIndex: isOverlay ? (slotNum === 1 ? 20 : 10) : 1 }}>
            <div className="flex items-start gap-3.5">
              <div className={`relative flex ${dims.secondScreen ? (dims.shouldSwap ? 'flex-row' : 'flex-col') : ''} items-center justify-center gap-2 border-2 ${dims.color} shadow-2xl transition-all duration-500 backdrop-blur-sm`} style={{ width: `${pBw}px`, height: `${pBh}px`, borderRadius: `${pBr}px`, backgroundColor: isOverlay ? dims.overlayColor : (hideClosedClamshellScreen ? '#f1f5f9' : dims.bg) }}>
                {hideClosedClamshellScreen ? (
                  <div className="flex flex-col items-center justify-center p-3 text-center select-none">
                    <div className="w-12 h-1 rounded-full bg-gray-300/80 mb-2" />
                    {!isOverlay && (
                      <>
                        <span className="text-[10px] sm:text-xs font-bold text-gray-500 uppercase tracking-wider">Closed Clamshell</span>
                        <span className="text-[9px] text-gray-400 font-medium mt-0.5">
                          Screens Inside ({dims.rawSw.toFixed(1)} × {dims.rawSh.toFixed(1)} mm)
                        </span>
                      </>
                    )}
                  </div>
                ) : (
                  <div className={`relative border border-gray-400/30 flex items-center justify-center overflow-hidden transition-all duration-500`} style={{ width: `${pSw}px`, height: `${pSh}px`, borderRadius: `${pSr}px`, backgroundColor: isOverlay ? dims.overlayScreenColor : dims.sbg }}>
                    {ratioVal && (
                      <div className={`absolute flex flex-col items-center justify-center shadow-lg transition-all duration-500 ${isOverlay ? dims.mediaBgOverlay : dims.mediaBg}`} style={{ width: `${dims.mediaW * scale}px`, height: `${dims.mediaH * scale}px` }}>
                        {!isOverlay && scale > 1.2 && <span className="text-white/90 font-bold text-[10px] sm:text-xs">{mediaDiagonal}"</span>}
                      </div>
                    )}
                    {!isOverlay && !ratioVal && <span className="text-[10px] sm:text-xs font-bold opacity-60 text-center whitespace-pre-wrap px-2 z-10">{dims.rawSw.toFixed(1)} x {dims.rawSh.toFixed(1)} mm</span>}
                  </div>
                )}
                {dims.secondScreen && !hideClosedClamshellScreen && (
                  <div
                    className="relative border border-dashed border-gray-400/60 flex items-center justify-center overflow-hidden transition-all duration-500"
                    style={{
                      width: `${dims.secondScreen.sw * scale}px`,
                      height: `${dims.secondScreen.sh * scale}px`,
                      borderRadius: `${(dims.secondScreen.sr || 0) * scale}px`,
                      backgroundColor: isOverlay ? dims.overlayScreenColor : dims.sbg,
                      opacity: 0.85
                    }}
                  >
                    {!isOverlay && scale > 1.1 && (
                      <span className="text-[9px] font-bold opacity-55 text-center px-1">
                        {dims.secondScreen.sw.toFixed(1)} × {dims.secondScreen.sh.toFixed(1)}
                      </span>
                    )}
                  </div>
                )}
              </div>

              {!isOverlay && perspective === 'front-and-side' && (
                <SideProfileBar dims={dims} isOverlay={false} slotNum={slotNum} vertical={true} />
              )}
            </div>

            {!isOverlay && (
              <div className="mt-5 text-center whitespace-nowrap bg-white/80 backdrop-blur-md px-4 py-2 rounded-xl shadow-sm border border-gray-100 z-10">
                <div className="font-bold text-gray-800">{dims.name}</div>
                <div className="text-xs text-gray-600 font-medium mt-0.5">
                  {showBezel
                    ? `Body: ${dims.rawBw.toFixed(1)} × ${dims.rawBh.toFixed(1)} × ${formatThick(dims.thickness)} mm`
                    : `Screen: ${dims.rawSw.toFixed(1)} × ${dims.rawSh.toFixed(1)} mm (${formatThick(dims.thickness)} mm thick)`}
                </div>
                {dims.thicknessNote && (
                  <div className="text-[11px] text-gray-500 font-medium mt-0.5">
                    {dims.thicknessNote}
                  </div>
                )}
                {ratioVal && <div className="text-xs text-indigo-600 font-bold mt-1 bg-indigo-50 px-2 py-0.5 rounded inline-block">Media: {dims.mediaW.toFixed(1)} x {dims.mediaH.toFixed(1)} mm</div>}
              </div>
            )}
          </div>
        );
      };

      const DeviceControl = ({ slotNum, config }) => {
        const device = DEVICES[config.id];
        const [isOpen, setIsOpen] = useState(false);
        const [searchQuery, setSearchQuery] = useState('');
        const [activeCategory, setActiveCategory] = useState('All');
        const dropdownRef = useRef(null);
        const searchInputRef = useRef(null);

        useEffect(() => {
          const handleClickOutside = (e) => {
            if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
              setIsOpen(false);
            }
          };
          document.addEventListener('mousedown', handleClickOutside);
          return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        useEffect(() => {
          if (isOpen && searchInputRef.current) {
            searchInputRef.current.focus();
          }
        }, [isOpen]);

        const filteredDevices = Object.entries(DEVICES).filter(([id, dev]) => {
          const matchesCategory = activeCategory === 'All' || dev.category === activeCategory;
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q || dev.name.toLowerCase().includes(q) || dev.brand.toLowerCase().includes(q) || dev.category.toLowerCase().includes(q);
          return matchesCategory && matchesSearch;
        });

        const foldLabels = device.foldLabels || ['Folded', 'Unfolded'];

        return (
          <section className="space-y-4">
            <div className="flex items-center justify-between mb-1">
              <div className="flex items-center gap-2">
                <div className={`w-3 h-3 rounded-full ${slotNum === 1 ? 'bg-blue-500' : 'bg-orange-500'}`}></div>
                <h2 className="text-sm font-bold text-gray-700">Device Slot {slotNum}</h2>
              </div>
              <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">{device.brand}</span>
            </div>

            <div className="relative" ref={dropdownRef}>
              <button
                type="button"
                onClick={() => setIsOpen(!isOpen)}
                className="w-full flex items-center justify-between bg-gray-50 hover:bg-gray-100/80 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 p-2.5 font-semibold transition-all text-left"
              >
                <div className="truncate pr-2">
                  <div className="text-gray-900 font-bold truncate">{device.name}</div>
                  <div className="text-[11px] text-gray-500 font-medium">{device.category}</div>
                </div>
                <ChevronDown className={`w-4 h-4 text-gray-500 shrink-0 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
              </button>

              {isOpen && (
                <div className="absolute left-0 right-0 mt-2 bg-white border border-gray-200 rounded-xl shadow-2xl z-50 overflow-hidden flex flex-col max-h-96">
                  <div className="p-2.5 border-b border-gray-100 bg-gray-50/50 space-y-2">
                    <div className="relative flex items-center">
                      <Search className="w-4 h-4 text-gray-400 absolute left-3 pointer-events-none" />
                      <input
                        ref={searchInputRef}
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search device or brand..."
                        className="w-full pl-9 pr-8 py-1.5 text-sm bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                      />
                      {searchQuery && (
                        <button
                          type="button"
                          onClick={() => setSearchQuery('')}
                          className="absolute right-2.5 text-gray-400 hover:text-gray-600"
                        >
                          <X className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>

                    <div className="flex gap-1 overflow-x-auto pb-1">
                      {CATEGORIES.map(cat => (
                        <button
                          key={cat}
                          type="button"
                          onClick={() => setActiveCategory(cat)}
                          className={`px-2 py-1 text-[11px] font-semibold rounded-md whitespace-nowrap transition-colors ${activeCategory === cat ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="overflow-y-auto divide-y divide-gray-50 max-h-60">
                    {filteredDevices.length === 0 ? (
                      <div className="p-4 text-center text-xs text-gray-400">No matching devices found</div>
                    ) : (
                      filteredDevices.map(([id, dev]) => {
                        const isSelected = id === config.id;
                        return (
                          <button
                            key={id}
                            type="button"
                            onClick={() => {
                              handleDeviceChange(slotNum, id);
                              setIsOpen(false);
                              setSearchQuery('');
                            }}
                            className={`w-full px-3.5 py-2.5 text-left flex items-center justify-between hover:bg-indigo-50/60 transition-colors ${isSelected ? 'bg-indigo-50/90 font-bold text-indigo-900' : 'text-gray-700'}`}
                          >
                            <div className="truncate pr-2">
                              <div className="text-sm truncate">{dev.name}</div>
                              <div className="text-[11px] text-gray-400 font-medium">
                                {dev.brand} • {dev.category} • {dev.hasFold ? `${formatThick(dev.variants.folded.thickness)} / ${formatThick(dev.variants.unfolded.thickness)} mm` : `${formatThick(dev.variants.normal.thickness)} mm`}
                              </div>
                            </div>
                            {dev.category === 'Foldables' && (
                              <span className="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 shrink-0">
                                {id === 'lg_rollable' ? 'Rollable' : 
                                 id === 'lg_wing' ? 'Swivel' :
                                 (id === 'huawei_mate_xt' || id === 'samsung_trifold' ? 'Tri-Fold' : 'Foldable')}
                              </span>
                            )}
                          </button>
                        );
                      })
                    )}
                  </div>
                </div>
              )}
            </div>

            {device.hasFold && (
              <div className="space-y-1.5">
                <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Form Factor</label>
                <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                  <button onClick={() => updateSlot(slotNum, { formFactor: 'folded', portrait: device.variants['folded'].defaultPortrait })} className={`py-1.5 px-3 text-sm rounded-md font-semibold transition-all ${config.formFactor === 'folded' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}>{foldLabels[0]}</button>
                  <button onClick={() => updateSlot(slotNum, { formFactor: 'unfolded', portrait: device.variants['unfolded'].defaultPortrait })} className={`py-1.5 px-3 text-sm rounded-md font-semibold transition-all ${config.formFactor === 'unfolded' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}>{foldLabels[1]}</button>
                </div>
              </div>
            )}
            <div className="space-y-1.5">
              <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Orientation</label>
              <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                <button onClick={() => updateSlot(slotNum, { portrait: true })} className={`py-1.5 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${config.portrait ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><Smartphone className="w-3.5 h-3.5" /> Portrait</button>
                <button onClick={() => updateSlot(slotNum, { portrait: false })} className={`py-1.5 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${!config.portrait ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><Smartphone className="w-3.5 h-3.5 rotate-90" /> Landscape</button>
              </div>
            </div>
          </section>
        );
      };

      return (
        <div className="min-h-screen lg:h-screen bg-gray-50 flex flex-col font-sans text-gray-900 lg:overflow-hidden">
          <header className="bg-white border-b border-gray-200 px-6 py-4 shadow-sm flex items-center justify-between z-30 shrink-0">
            <h1 className="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 text-gray-800"><Layout className="w-5 h-5 sm:w-6 sm:h-6 text-indigo-600" /> Dimension <span className="text-indigo-600">Pro</span></h1>
            <div className="hidden sm:block text-sm text-gray-500 font-medium">Device Size Comparison Engine</div>
          </header>
          <main className="flex-1 flex flex-col lg:flex-row relative lg:overflow-hidden">
            <div className="w-full lg:w-[22rem] bg-white border-b lg:border-b-0 lg:border-r border-gray-200 p-6 flex flex-col gap-6 lg:overflow-y-auto z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)] shrink-0">
              <DeviceControl slotNum={1} config={slot1} />
              <div className="h-px bg-gray-100"></div>
              <DeviceControl slotNum={2} config={slot2} />
              <div className="h-px bg-gray-100"></div>
              
              <section className="space-y-4">
                <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">Comparison Stats</h2>
                <div className="bg-indigo-50/50 px-4 py-3 rounded-xl border border-indigo-100/80 flex flex-col gap-3">
                  {getComparisonText(dims1.screenArea, dims2.screenArea, dims1.name, dims2.name, 'Total Screen Area')}
                  <div className="h-px bg-indigo-100/80 w-full"></div>
                  {getThicknessComparisonText(dims1, dims2)}
                  {RATIOS[mediaRatio].value && (
                    <>
                      <div className="h-px bg-indigo-100/80 w-full"></div>
                      {getComparisonText(dims1.mediaArea, dims2.mediaArea, dims1.name, dims2.name, `${RATIOS[mediaRatio].label.split(' ')[0]} Video Size`)}
                    </>
                  )}
                </div>
              </section>

              <div className="h-px bg-gray-100"></div>

              <section className="space-y-4">
                <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">Global Settings</h2>
                <div className="space-y-2">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Thickness & Perspective</label>
                  <div className="grid grid-cols-3 gap-1 bg-gray-100/80 p-1 rounded-lg">
                    {[
                      { id: 'front-and-side', label: 'Front + Edge' },
                      { id: 'front', label: 'Front Only' },
                      { id: 'side-only', label: 'Table Edge' }
                    ].map(opt => (
                      <button
                        key={opt.id}
                        onClick={() => setPerspective(opt.id)}
                        className={`py-1.5 px-2 text-xs rounded-md font-semibold transition-all ${perspective === opt.id ? 'bg-white shadow-sm text-indigo-700 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="space-y-1.5 relative">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-1.5"><Film className="w-3.5 h-3.5" /> Media Aspect Ratio</label>
                  <select value={mediaRatio} onChange={(e) => setMediaRatio(e.target.value)} className="w-full appearance-none bg-indigo-50 border border-indigo-100 text-indigo-900 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 font-bold cursor-pointer pr-10">
                    {Object.entries(RATIOS).map(([key, data]) => <option key={key} value={key}>{data.label}</option>)}
                  </select>
                  <ChevronDown className="absolute right-3 top-9 w-4 h-4 text-indigo-500 pointer-events-none" />
                </div>
                <div className="flex items-center justify-between p-3.5 bg-gray-100/80 rounded-xl border border-gray-200/60">
                  <div className="flex flex-col"><label className="text-sm font-bold text-gray-800 cursor-pointer select-none">Include Bezels</label></div>
                  <button onClick={() => setShowBezel(!showBezel)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${showBezel ? 'bg-indigo-600' : 'bg-gray-300'}`}><span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${showBezel ? 'translate-x-6' : 'translate-x-1'}`} /></button>
                </div>
                <div className="space-y-2">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">View Mode</label>
                  <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                    <button onClick={() => setViewMode('side-by-side')} className={`py-2 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${viewMode === 'side-by-side' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><MoveHorizontal className="w-4 h-4" /> Side-by-Side</button>
                    <button onClick={() => setViewMode('overlay')} className={`py-2 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${viewMode === 'overlay' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><Layers className="w-4 h-4" /> Overlay</button>
                  </div>
                </div>
                <div className="space-y-2">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Alignment ({showBezel ? 'Body' : 'Screen'})</label>
                  <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                    {[
                      { id: 'center', label: 'Center' },
                      { id: 'bottom-left', label: 'Bottom-Left' },
                      { id: 'bottom', label: 'Bottom' },
                      { id: 'left', label: 'Left' }
                    ].map(opt => (
                      <button
                        key={opt.id}
                        onClick={() => setAlignment(opt.id)}
                        className={`py-1.5 px-3 text-sm rounded-md font-semibold transition-all ${alignment === opt.id ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="space-y-2 pt-2">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider flex justify-between"><span>Zoom Scale</span><span className="font-mono text-gray-400">{scale.toFixed(2)}x</span></label>
                  <div className="flex items-center gap-3">
                    <button onClick={() => setScale(s => Math.max(0.5, +(s - 0.05).toFixed(2)))} className="p-1.5 bg-gray-100 hover:bg-gray-200 rounded-md text-gray-600 transition-colors"><Minus className="w-4 h-4" /></button>
                    <input type="range" min="0.5" max="12" step="0.01" value={scale} onChange={(e) => setScale(parseFloat(e.target.value))} className="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
                    <button onClick={() => setScale(s => Math.min(12, +(s + 0.05).toFixed(2)))} className="p-1.5 bg-gray-100 hover:bg-gray-200 rounded-md text-gray-600 transition-colors"><Plus className="w-4 h-4" /></button>
                  </div>
                </div>
              </section>
            </div>
            <div className="flex-1 relative bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:20px_20px] bg-gray-50 overflow-auto min-h-[70vh] lg:min-h-0 pb-16">
              {viewMode === 'overlay' && perspective !== 'side-only' && (
                <div className="absolute top-6 left-6 bg-white/90 backdrop-blur-md px-5 py-4 rounded-2xl shadow-xl border border-gray-100 z-40 text-sm space-y-3 pointer-events-none">
                  <div className="flex items-center gap-3"><div className={`w-4 h-4 rounded-md ${SLOT_THEMES[1].legendColor}`}></div><span className="font-bold text-gray-800">{dims1.name} ({formatThick(dims1.thickness)} mm)</span></div>
                  <div className="flex items-center gap-3"><div className={`w-4 h-4 rounded-md ${SLOT_THEMES[2].legendColor}`}></div><span className="font-bold text-gray-800">{dims2.name} ({formatThick(dims2.thickness)} mm)</span></div>
                </div>
              )}
              <div className="min-h-full min-w-full p-8 md:p-16 flex items-center justify-center">
                {perspective === 'side-only' ? (
                  <div className="flex flex-col items-center justify-center gap-14">
                    <div className="text-xs font-bold uppercase tracking-widest text-gray-400 bg-white/80 px-3 py-1 rounded-full border border-gray-200 shadow-sm">
                      Tabletop Edge Profile Comparison (Scaled for Clarity)
                    </div>
                    <div className="flex flex-col xl:flex-row items-center xl:items-end justify-center gap-12 xl:gap-20">
                      <SideProfileBar dims={dims1} isOverlay={false} slotNum={1} vertical={false} />
                      <SideProfileBar dims={dims2} isOverlay={false} slotNum={2} vertical={false} />
                    </div>
                  </div>
                ) : viewMode === 'side-by-side' ? (
                  <div className={`flex flex-col md:flex-row justify-center gap-16 lg:gap-32 ${{
                    'center': 'items-center md:items-center',
                    'bottom-left': 'items-start md:items-end',
                    'bottom': 'items-center md:items-end',
                    'left': 'items-start md:items-center'
                  }[alignment]}`}>
                    <DevicePreview dims={dims1} isOverlay={false} slotNum={1} />
                    <DevicePreview dims={dims2} isOverlay={false} slotNum={2} />
                  </div>
                ) : (
                  <div className="flex flex-col md:flex-row items-center md:items-end gap-12 lg:gap-16">
                    <div className={`grid relative ${{
                      'center': 'items-center justify-items-center',
                      'bottom-left': 'items-end justify-items-start',
                      'bottom': 'items-end justify-items-center',
                      'left': 'items-center justify-items-start'
                    }[alignment]}`}>
                      <div className="col-start-1 row-start-1"><DevicePreview dims={dims2} isOverlay={true} slotNum={2} /></div>
                      <div className="col-start-1 row-start-1"><DevicePreview dims={dims1} isOverlay={true} slotNum={1} /></div>
                    </div>

                    {perspective === 'front-and-side' && (
                      <div className="flex flex-col items-center bg-white/75 backdrop-blur-md p-4 rounded-2xl border border-gray-200/80 shadow-lg">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-3">Edge Thickness</span>
                        <div className="flex items-end gap-4">
                          <SideProfileBar dims={dims1} isOverlay={false} slotNum={1} vertical={true} />
                          <SideProfileBar dims={dims2} isOverlay={false} slotNum={2} vertical={true} />
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
