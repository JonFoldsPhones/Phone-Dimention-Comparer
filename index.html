<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dimension Comparer Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SvgIcon = ({ children, className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>;
    const Smartphone = ({ className }) => <SvgIcon className={className}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></SvgIcon>;
    const Tablet = ({ className }) => <SvgIcon className={className}><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></SvgIcon>;
    const Layers = ({ className }) => <SvgIcon className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></SvgIcon>;
    const MoveHorizontal = ({ className }) => <SvgIcon className={className}><polyline points="18 8 22 12 18 16"/><polyline points="6 8 2 12 6 16"/><line x1="2" x2="22" y1="12" y2="12"/></SvgIcon>;
    const Plus = ({ className }) => <SvgIcon className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></SvgIcon>;
    const Minus = ({ className }) => <SvgIcon className={className}><line x1="5" y1="12" x2="19" y2="12"/></SvgIcon>;
    const Layout = ({ className }) => <SvgIcon className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></SvgIcon>;
    const ChevronDown = ({ className }) => <SvgIcon className={className}><polyline points="6 9 12 15 18 9"/></SvgIcon>;
    const Film = ({ className }) => <SvgIcon className={className}><rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/><line x1="7" x2="7" y1="2" y2="22"/><line x1="17" x2="17" y1="2" y2="22"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="2" x2="7" y1="7" y2="7"/><line x1="2" x2="7" y1="17" y2="17"/><line x1="17" x2="22" y1="17" y2="17"/><line x1="17" x2="22" y1="7" y2="7"/></SvgIcon>;

    const DEVICES = {
      iphone_duo: {
        name: 'iPhone Duo', brand: 'Apple', hasFold: true,
        variants: {
          folded: { bw: 84.1, bh: 117.8, sw: 77.1, sh: 112.2, br: 10, sr: 8, defaultPortrait: true },
          unfolded: { bw: 164.6, bh: 117.8, sw: 157.5, sh: 110.8, br: 10, sr: 8, defaultPortrait: false }
        }
      },
      iphone_18_pro_max: {
        name: 'iPhone 18 Pro Max', brand: 'Apple', hasFold: false,
        variants: { normal: { bw: 78.0, bh: 163.4, sw: 73.5, sh: 159.2, br: 14, sr: 12, defaultPortrait: true } }
      },
      iphone_18_pro: {
        name: 'iPhone 18 Pro', brand: 'Apple', hasFold: false,
        variants: { normal: { bw: 71.9, bh: 150.0, sw: 66.6, sh: 144.8, br: 13, sr: 11, defaultPortrait: true } }
      },
      iphone_15_pro: {
        name: 'iPhone 15 Pro', brand: 'Apple', hasFold: false,
        variants: { normal: { bw: 70.6, bh: 146.6, sw: 64.9, sh: 140.6, br: 12, sr: 10, defaultPortrait: true } }
      },
      iphone_13_mini: {
        name: 'iPhone 13 mini', brand: 'Apple', hasFold: false,
        variants: { normal: { bw: 64.2, bh: 131.5, sw: 57.6, sh: 124.9, br: 10, sr: 8, defaultPortrait: true } }
      },
      iphone_original: {
        name: 'Original iPhone (2007)', brand: 'Apple', hasFold: false,
        variants: { normal: { bw: 61.0, bh: 115.0, sw: 49.3, sh: 74.0, br: 11, sr: 0, defaultPortrait: true } }
      },
      ipad_air_11: {
        name: 'iPad Air 11"', brand: 'Apple', hasFold: false,
        variants: { normal: { bw: 178.5, bh: 247.6, sw: 157.6, sh: 226.9, br: 14, sr: 10, defaultPortrait: true } }
      },
      ipad_mini_a17: {
        name: 'iPad mini (A17 Pro)', brand: 'Apple', hasFold: false,
        variants: { normal: { bw: 134.8, bh: 195.4, sw: 115.7, sh: 176.2, br: 12, sr: 8, defaultPortrait: true } }
      },
      pixel_fold: {
        name: 'Pixel Fold (Original)', brand: 'Google', hasFold: true,
        variants: {
          folded: { bw: 79.5, bh: 139.7, sw: 67.5, sh: 130.4, br: 8, sr: 6, defaultPortrait: true },
          unfolded: { bw: 158.7, bh: 139.7, sw: 148.4, sh: 123.7, br: 8, sr: 6, defaultPortrait: false }
        }
      },
      s26_ultra: {
        name: 'Galaxy S26 Ultra', brand: 'Samsung', hasFold: false,
        variants: { normal: { bw: 78.1, bh: 163.6, sw: 73.4, sh: 159.1, br: 8, sr: 6, defaultPortrait: true } }
      },
      z_fold_8_ultra: {
        name: 'Galaxy Z Fold 8 Ultra', brand: 'Samsung', hasFold: true,
        variants: {
          folded: { bw: 72.8, bh: 158.4, sw: 65.0, sh: 151.7, br: 8, sr: 6, defaultPortrait: true },
          unfolded: { bw: 143.2, bh: 158.4, sw: 135.8, sh: 150.7, br: 8, sr: 6, defaultPortrait: true } 
        }
      },
      z_fold_8: {
        name: 'Galaxy Z Fold 8', brand: 'Samsung', hasFold: true,
        variants: {
          folded: { bw: 81.9, bh: 123.9, sw: 74.7, sh: 118.0, br: 6, sr: 4, defaultPortrait: true },
          unfolded: { bw: 161.4, bh: 123.9, sw: 154.1, sh: 116.3, br: 6, sr: 4, defaultPortrait: false }
        }
      },
      z_fold_original: {
        name: 'Original Galaxy Fold (2019)', brand: 'Samsung', hasFold: true,
        variants: {
          folded: { bw: 62.9, bh: 160.9, sw: 46.0, sh: 107.4, br: 9, sr: 4, defaultPortrait: true },
          unfolded: { bw: 117.9, bh: 160.9, sw: 107.7, sh: 150.9, br: 9, sr: 6, defaultPortrait: true }
        }
      },
      xiaomi_18_fold: {
        name: 'Xiaomi 18 Fold', brand: 'Xiaomi', hasFold: true,
        variants: {
          folded: { bw: 83.6, bh: 117.8, sw: 77.0, sh: 112.9, br: 10, sr: 8, defaultPortrait: true },
          unfolded: { bw: 163.8, bh: 117.8, sw: 157.2, sh: 111.2, br: 10, sr: 8, defaultPortrait: false }
        }
      }
    };

    const SLOT_THEMES = {
      1: { color: "border-blue-500", sbg: "bg-blue-100", overlayColor: "rgba(59, 130, 246, 0.2)", overlayScreenColor: "rgba(59, 130, 246, 0.5)", legendColor: "bg-blue-500/60 ring-blue-500/30", mediaBg: "bg-slate-800", mediaBgOverlay: "bg-blue-700/70 border border-blue-400/50" },
      2: { color: "border-orange-500", sbg: "bg-orange-100", overlayColor: "rgba(249, 115, 22, 0.2)", overlayScreenColor: "rgba(249, 115, 22, 0.5)", legendColor: "bg-orange-500/60 ring-orange-500/30", mediaBg: "bg-slate-800", mediaBgOverlay: "bg-orange-700/70 border border-orange-400/50" }
    };

    const RATIOS = {
      'none': { label: 'None (Full Screen)', value: null },
      '16:9': { label: '16:9 (Standard Video)', value: 16 / 9 },
      '9:16': { label: '9:16 (Vertical Video)', value: 9 / 16 },
      '21:9': { label: '21:9 (Cinematic)', value: 21 / 9 },
      '4:3': { label: '4:3 (Classic TV)', value: 4 / 3 },
      '1:1': { label: '1:1 (Square)', value: 1 / 1 },
    };

    const App = () => {
      const [slot1, setSlot1] = useState({ id: 'iphone_duo', formFactor: 'unfolded', portrait: false });
      const [slot2, setSlot2] = useState({ id: 'z_fold_8', formFactor: 'unfolded', portrait: false });
      const [showBezel, setShowBezel] = useState(true);
      const [viewMode, setViewMode] = useState('side-by-side');
      const [alignment, setAlignment] = useState('center');
      const [mediaRatio, setMediaRatio] = useState('16:9');
      const [scale, setScale] = useState(2.2);

      const handleDeviceChange = (slot, newId) => {
        const device = DEVICES[newId];
        const formFactor = device.hasFold ? 'folded' : 'normal';
        const portrait = device.variants[formFactor].defaultPortrait;
        if (slot === 1) setSlot1({ id: newId, formFactor, portrait });
        else setSlot2({ id: newId, formFactor, portrait });
      };

      const updateSlot = (slotNum, updates) => {
        if (slotNum === 1) setSlot1({ ...slot1, ...updates });
        else setSlot2({ ...slot2, ...updates });
      };

      const getComputedDims = (config, slotNum, currentRatio) => {
        const device = DEVICES[config.id];
        const variant = device.variants[config.formFactor];
        const theme = SLOT_THEMES[slotNum];
        const isDefaultPortrait = variant.defaultPortrait;
        const shouldSwap = config.portrait !== isDefaultPortrait;

        let curBw = variant.bw, curBh = variant.bh, curSw = variant.sw, curSh = variant.sh;
        if (shouldSwap) {
          [curBw, curBh] = [curBh, curBw];
          [curSw, curSh] = [curSh, curSw];
        }

        const formName = device.hasFold ? (config.formFactor === 'folded' ? ' (Folded)' : ' (Unfolded)') : '';
        const screenArea = curSw * curSh;
        const ratioVal = RATIOS[currentRatio].value;
        let mediaW = 0, mediaH = 0, mediaArea = 0;
        
        if (ratioVal) {
          mediaW = Math.min(curSw, curSh * ratioVal);
          mediaH = Math.min(curSh, curSw / ratioVal);
          mediaArea = mediaW * mediaH;
        }

        let finalDims = {
          name: `${device.name}${formName}`,
          color: theme.color, bg: "bg-white", sbg: theme.sbg,
          overlayColor: theme.overlayColor, overlayScreenColor: theme.overlayScreenColor,
          mediaBg: theme.mediaBg, mediaBgOverlay: theme.mediaBgOverlay,
          br: variant.br, sr: variant.sr, rawBw: curBw, rawBh: curBh, rawSw: curSw, rawSh: curSh,
          screenArea, mediaW, mediaH, mediaArea
        };

        if (!showBezel) return { ...finalDims, bw: curSw, bh: curSh, sw: curSw, sh: curSh, br: variant.sr };
        return { ...finalDims, bw: curBw, bh: curBh, sw: curSw, sh: curSh };
      };

      const dims1 = getComputedDims(slot1, 1, mediaRatio);
      const dims2 = getComputedDims(slot2, 2, mediaRatio);

      const getComparisonText = (val1, val2, name1, name2, label) => {
        if (!val1 || !val2) return null;
        if (Math.abs(val1 - val2) < 0.1) {
          return (
            <div className="flex flex-col gap-0.5">
              <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">{label}</span>
              <div className="text-sm font-bold text-gray-800">Identical Size</div>
            </div>
          );
        }
        
        const is1Bigger = val1 > val2;
        const biggerName = is1Bigger ? name1 : name2;
        const smallerName = is1Bigger ? name2 : name1;
        const ratio = is1Bigger ? (val1 / val2) : (val2 / val1);
        const percent = ((ratio - 1) * 100).toFixed(1);
        const highlightColor = is1Bigger ? 'text-blue-600' : 'text-orange-600';
        
        return (
          <div className="flex flex-col gap-0.5">
            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">{label}</span>
            <div className="text-sm text-gray-700 leading-tight">
              <span className="font-bold text-gray-900">{biggerName}</span> is <span className={`font-black ${highlightColor}`}>+{percent}%</span> larger than {smallerName}
            </div>
          </div>
        );
      };

      const DevicePreview = ({ dims, isOverlay, slotNum }) => {
        const pBw = dims.bw * scale, pBh = dims.bh * scale, pSw = dims.sw * scale, pSh = dims.sh * scale;
        const pBr = dims.br * scale, pSr = dims.sr * scale;
        const ratioVal = RATIOS[mediaRatio].value;
        const mediaDiagonal = ratioVal ? (Math.sqrt(dims.mediaW**2 + dims.mediaH**2) / 25.4).toFixed(2) : 0;
        const previewAlignClass = !isOverlay && (alignment === 'left' || alignment === 'bottom-left') ? 'items-start md:items-center' : 'items-center';

        return (
          <div className={`relative flex flex-col ${previewAlignClass} justify-center transition-all duration-500 ease-[cubic-bezier(0.23,1,0.32,1)]`} style={{ zIndex: isOverlay ? (slotNum === 1 ? 20 : 10) : 1 }}>
            <div className={`flex items-center justify-center border-2 ${dims.color} shadow-2xl transition-all duration-500 backdrop-blur-sm`} style={{ width: `${pBw}px`, height: `${pBh}px`, borderRadius: `${pBr}px`, backgroundColor: isOverlay ? dims.overlayColor : dims.bg }}>
              <div className={`relative border border-gray-400/30 flex items-center justify-center overflow-hidden transition-all duration-500`} style={{ width: `${pSw}px`, height: `${pSh}px`, borderRadius: `${pSr}px`, backgroundColor: isOverlay ? dims.overlayScreenColor : dims.sbg }}>
                {ratioVal && (
                  <div className={`absolute flex flex-col items-center justify-center shadow-lg transition-all duration-500 ${isOverlay ? dims.mediaBgOverlay : dims.mediaBg}`} style={{ width: `${dims.mediaW * scale}px`, height: `${dims.mediaH * scale}px` }}>
                    {!isOverlay && scale > 1.2 && <span className="text-white/90 font-bold text-[10px] sm:text-xs">{mediaDiagonal}"</span>}
                  </div>
                )}
                {!isOverlay && !ratioVal && <span className="text-[10px] sm:text-xs font-bold opacity-60 text-center whitespace-pre-wrap px-2 z-10">{dims.rawSw.toFixed(1)} x {dims.rawSh.toFixed(1)} mm</span>}
              </div>
            </div>
            {!isOverlay && (
              <div className="mt-5 text-center whitespace-nowrap bg-white/80 backdrop-blur-md px-4 py-2 rounded-xl shadow-sm border border-gray-100 z-10">
                <div className="font-bold text-gray-800">{dims.name}</div>
                <div className="text-xs text-gray-600 font-medium mt-0.5">{showBezel ? `Body: ${dims.rawBw.toFixed(1)} x ${dims.rawBh.toFixed(1)} mm` : `Screen: ${dims.rawSw.toFixed(1)} x ${dims.rawSh.toFixed(1)} mm`}</div>
                {ratioVal && <div className="text-xs text-indigo-600 font-bold mt-1 bg-indigo-50 px-2 py-0.5 rounded inline-block">Media: {dims.mediaW.toFixed(1)} x {dims.mediaH.toFixed(1)} mm</div>}
              </div>
            )}
          </div>
        );
      };

      const DeviceControl = ({ slotNum, config }) => {
        const device = DEVICES[config.id];
        return (
          <section className="space-y-4">
            <div className="flex items-center gap-2 mb-2">
              <div className={`w-3 h-3 rounded-full ${slotNum === 1 ? 'bg-blue-500' : 'bg-orange-500'}`}></div>
              <h2 className="text-sm font-bold text-gray-700">Device Slot {slotNum}</h2>
            </div>
            <div className="space-y-1.5 relative">
              <select value={config.id} onChange={(e) => handleDeviceChange(slotNum, e.target.value)} className="w-full appearance-none bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-2.5 font-medium cursor-pointer pr-10">
                <optgroup label="Apple">
                  <option value="iphone_duo">iPhone Duo (Foldable)</option>
                  <option value="iphone_18_pro_max">iPhone 18 Pro Max</option>
                  <option value="iphone_18_pro">iPhone 18 Pro</option>
                  <option value="iphone_15_pro">iPhone 15 Pro</option>
                  <option value="iphone_13_mini">iPhone 13 mini</option>
                  <option value="iphone_original">Original iPhone (2007)</option>
                  <option value="ipad_air_11">iPad Air 11"</option>
                  <option value="ipad_mini_a17">iPad mini (A17 Pro)</option>
                </optgroup>
                <optgroup label="Samsung">
                  <option value="s26_ultra">Galaxy S26 Ultra</option>
                  <option value="z_fold_8_ultra">Galaxy Z Fold 8 Ultra</option>
                  <option value="z_fold_8">Galaxy Z Fold 8 (Standard)</option>
                  <option value="z_fold_original">Original Galaxy Fold (2019)</option>
                </optgroup>
                <optgroup label="Google">
                  <option value="pixel_fold">Pixel Fold (Original)</option>
                </optgroup>
                <optgroup label="Xiaomi">
                  <option value="xiaomi_18_fold">Xiaomi 18 Fold</option>
                </optgroup>
              </select>
              <ChevronDown className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" />
            </div>
            {device.hasFold && (
              <div className="space-y-1.5">
                <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Form Factor</label>
                <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                  <button onClick={() => updateSlot(slotNum, { formFactor: 'folded', portrait: device.variants['folded'].defaultPortrait })} className={`py-1.5 px-3 text-sm rounded-md font-semibold transition-all ${config.formFactor === 'folded' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}>Folded</button>
                  <button onClick={() => updateSlot(slotNum, { formFactor: 'unfolded', portrait: device.variants['unfolded'].defaultPortrait })} className={`py-1.5 px-3 text-sm rounded-md font-semibold transition-all ${config.formFactor === 'unfolded' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}>Unfolded</button>
                </div>
              </div>
            )}
            <div className="space-y-1.5">
              <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Orientation</label>
              <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                <button onClick={() => updateSlot(slotNum, { portrait: true })} className={`py-1.5 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${config.portrait ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><Smartphone className="w-3.5 h-3.5" /> Portrait</button>
                <button onClick={() => updateSlot(slotNum, { portrait: false })} className={`py-1.5 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${!config.portrait ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><Smartphone className="w-3.5 h-3.5 rotate-90" /> Landscape</button>
              </div>
            </div>
          </section>
        );
      };

      return (
        <div className="min-h-screen lg:h-screen bg-gray-50 flex flex-col font-sans text-gray-900 lg:overflow-hidden">
          <header className="bg-white border-b border-gray-200 px-6 py-4 shadow-sm flex items-center justify-between z-30 shrink-0">
            <h1 className="text-xl sm:text-2xl font-black tracking-tight flex items-center gap-2 text-gray-800"><Layout className="w-5 h-5 sm:w-6 sm:h-6 text-indigo-600" /> Dimension <span className="text-indigo-600">Pro</span></h1>
            <div className="hidden sm:block text-sm text-gray-500 font-medium">Device Size Comparison Engine</div>
          </header>
          <main className="flex-1 flex flex-col lg:flex-row relative lg:overflow-hidden">
            <div className="w-full lg:w-[22rem] bg-white border-b lg:border-b-0 lg:border-r border-gray-200 p-6 flex flex-col gap-6 lg:overflow-y-auto z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)] shrink-0">
              <DeviceControl slotNum={1} config={slot1} />
              <div className="h-px bg-gray-100"></div>
              <DeviceControl slotNum={2} config={slot2} />
              <div className="h-px bg-gray-100"></div>
              
              <section className="space-y-4">
                <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">Comparison Stats</h2>
                <div className="bg-indigo-50/50 px-4 py-3 rounded-xl border border-indigo-100/80 flex flex-col gap-3">
                  {getComparisonText(dims1.screenArea, dims2.screenArea, dims1.name, dims2.name, 'Total Screen Area')}
                  {RATIOS[mediaRatio].value && (
                    <>
                      <div className="h-px bg-indigo-100/80 w-full"></div>
                      {getComparisonText(dims1.mediaArea, dims2.mediaArea, dims1.name, dims2.name, `${RATIOS[mediaRatio].label.split(' ')[0]} Video Size`)}
                    </>
                  )}
                </div>
              </section>

              <div className="h-px bg-gray-100"></div>

              <section className="space-y-4">
                <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">Global Settings</h2>
                <div className="space-y-1.5 relative">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-1.5"><Film className="w-3.5 h-3.5" /> Media Aspect Ratio</label>
                  <select value={mediaRatio} onChange={(e) => setMediaRatio(e.target.value)} className="w-full appearance-none bg-indigo-50 border border-indigo-100 text-indigo-900 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 font-bold cursor-pointer pr-10">
                    {Object.entries(RATIOS).map(([key, data]) => <option key={key} value={key}>{data.label}</option>)}
                  </select>
                  <ChevronDown className="absolute right-3 top-9 w-4 h-4 text-indigo-500 pointer-events-none" />
                </div>
                <div className="flex items-center justify-between p-3.5 bg-gray-100/80 rounded-xl border border-gray-200/60">
                  <div className="flex flex-col"><label className="text-sm font-bold text-gray-800 cursor-pointer select-none">Include Bezels</label></div>
                  <button onClick={() => setShowBezel(!showBezel)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${showBezel ? 'bg-indigo-600' : 'bg-gray-300'}`}><span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${showBezel ? 'translate-x-6' : 'translate-x-1'}`} /></button>
                </div>
                <div className="space-y-2">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">View Mode</label>
                  <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                    <button onClick={() => setViewMode('side-by-side')} className={`py-2 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${viewMode === 'side-by-side' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><MoveHorizontal className="w-4 h-4" /> Side-by-Side</button>
                    <button onClick={() => setViewMode('overlay')} className={`py-2 px-3 text-sm rounded-md font-semibold flex items-center justify-center gap-1.5 transition-all ${viewMode === 'overlay' ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}><Layers className="w-4 h-4" /> Overlay</button>
                  </div>
                </div>
                <div className="space-y-2">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Alignment ({showBezel ? 'Body' : 'Screen'})</label>
                  <div className="grid grid-cols-2 gap-1.5 bg-gray-100/80 p-1 rounded-lg">
                    {[
                      { id: 'center', label: 'Center' },
                      { id: 'bottom-left', label: 'Bottom-Left' },
                      { id: 'bottom', label: 'Bottom' },
                      { id: 'left', label: 'Left' }
                    ].map(opt => (
                      <button
                        key={opt.id}
                        onClick={() => setAlignment(opt.id)}
                        className={`py-1.5 px-3 text-sm rounded-md font-semibold transition-all ${alignment === opt.id ? 'bg-white shadow-sm text-gray-900 ring-1 ring-black/5' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-200/50'}`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="space-y-2 pt-2">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider flex justify-between"><span>Zoom Scale</span><span className="font-mono text-gray-400">{scale.toFixed(1)}x</span></label>
                  <div className="flex items-center gap-3">
                    <button onClick={() => setScale(s => Math.max(0.5, s - 0.2))} className="p-1.5 bg-gray-100 hover:bg-gray-200 rounded-md text-gray-600 transition-colors"><Minus className="w-4 h-4" /></button>
                    <input type="range" min="0.5" max="4" step="0.1" value={scale} onChange={(e) => setScale(parseFloat(e.target.value))} className="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
                    <button onClick={() => setScale(s => Math.min(4, s + 0.2))} className="p-1.5 bg-gray-100 hover:bg-gray-200 rounded-md text-gray-600 transition-colors"><Plus className="w-4 h-4" /></button>
                  </div>
                </div>
              </section>
            </div>
            <div className="flex-1 relative bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:20px_20px] bg-gray-50 overflow-auto min-h-[70vh] lg:min-h-0 pb-16">
              {viewMode === 'overlay' && (
                <div className="absolute top-6 left-6 bg-white/90 backdrop-blur-md px-5 py-4 rounded-2xl shadow-xl border border-gray-100 z-40 text-sm space-y-3 pointer-events-none">
                  <div className="flex items-center gap-3"><div className={`w-4 h-4 rounded-md ${SLOT_THEMES[1].legendColor}`}></div><span className="font-bold text-gray-800">{dims1.name}</span></div>
                  <div className="flex items-center gap-3"><div className={`w-4 h-4 rounded-md ${SLOT_THEMES[2].legendColor}`}></div><span className="font-bold text-gray-800">{dims2.name}</span></div>
                </div>
              )}
              <div className="min-h-full min-w-full p-8 md:p-16 flex items-center justify-center">
                {viewMode === 'side-by-side' ? (
                  <div className={`flex flex-col md:flex-row justify-center gap-16 lg:gap-32 ${{
                    'center': 'items-center md:items-center',
                    'bottom-left': 'items-start md:items-end',
                    'bottom': 'items-center md:items-end',
                    'left': 'items-start md:items-center'
                  }[alignment]}`}>
                    <DevicePreview dims={dims1} isOverlay={false} slotNum={1} />
                    <DevicePreview dims={dims2} isOverlay={false} slotNum={2} />
                  </div>
                ) : (
                  <div className={`grid relative ${{
                    'center': 'items-center justify-items-center',
                    'bottom-left': 'items-end justify-items-start',
                    'bottom': 'items-end justify-items-center',
                    'left': 'items-center justify-items-start'
                  }[alignment]}`}>
                    <div className="col-start-1 row-start-1"><DevicePreview dims={dims2} isOverlay={true} slotNum={2} /></div>
                    <div className="col-start-1 row-start-1"><DevicePreview dims={dims1} isOverlay={true} slotNum={1} /></div>
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
